# Minecraft Java 版 26.2 世界种子
seed=9206294873968313284

# 搜索中心（方块坐标）以及从中心向外搜索试炼密室的半径
search-center-x=0
search-center-z=0
search-radius-blocks=10000
# true：忽略搜索中心和半径，扫描完整的 6000万 x 6000万 世界正方形
full-world=false

# 聚类统计半径；circle 表示水平圆形，square 表示中心向 X/Z 各扩展指定距离
cluster-radius-blocks=128
area-shape=circle
# 圆形或方形范围内至少包含的试炼密室数量
min-structures=1
# 范围内至少包含的试炼刷怪笼数量
min-spawners=20

# 快速扫描线程数，以及每个扫描分片的边长（方块）
scan-threads=8
scan-shard-size-blocks=262144
