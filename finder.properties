# ==================== 1. 本次运行 ====================
# Minecraft Java 版世界种子
seed=0
# 当前运行时固定为 Minecraft 26.2
minecraft-version=26.2

# ==================== 2. 公共搜索范围 ====================
# 坐标和半径均为方块；形状可选 circle 或 square
search-center-x=0
search-center-z=0
search-radius-blocks=300000
search-area-shape=circle
# true：忽略以上中心、半径和形状，扫描完整世界
full-world=false

# ==================== 3. 公共扫描性能 ====================
# 试炼密室会根据搜索半径和线程数自动分片；4 GB 内存建议线程数不超过 8
scan-threads=8

# ==================== 4. 试炼刷怪笼专用 ====================
# 统计范围的半径和形状；形状可选 circle 或 square
trial-cluster-radius-blocks=128
trial-area-shape=circle
# 结果至少包含的试炼密室数和刷怪笼数
trial-min-structures=2
trial-min-spawners=20
